name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install zig (cross-compiler for aarch64 + wasm)
        run: python -m pip install ziglang
      - name: Build + test (gen, native tests, UI tests, dsp.so, wasm)
        run: scripts/build.sh
      - name: Generated files are committed
        run: git diff --exit-code -- src/dsp/*_gen.* || (echo "run scripts/build.sh and commit the generated files" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: quark-module
          path: dist/quark-module.tar.gz
